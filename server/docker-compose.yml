version: '3.8'

services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: lifelink_postgres
    restart: always
    environment:
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: lifelink_password_2026
      POSTGRES_DB: lifelink_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink -d lifelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. NestJS Backend Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifelink_backend
    restart: always
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: lifelink
      DB_PASSWORD: lifelink_password_2026
      DB_NAME: lifelink_db
      JWT_SECRET: lifelink_super_secret_jwt_key_2026
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
